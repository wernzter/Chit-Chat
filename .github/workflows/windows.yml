name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test the Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Build with analyzers
        run: dotnet build ChitChat.sln -c Release --no-incremental -warnaserror
      - name: Run tests
        run: dotnet test ChitChat.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Publish and run the executable
        shell: pwsh
        run: |
          dotnet publish src/ChitChat.App/ChitChat.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed" }
          $result = Start-Process -FilePath artifacts/publish/ChitChat.App.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Chit-Chat self-test failed ($($result.ExitCode))" }
      - name: Upload the Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChitChat-win-x64
          path: |
            windows/artifacts/publish/*.exe
            windows/artifacts/publish/*.dll
            windows/artifacts/publish/*.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: windows/artifacts/test-results/*.trx
          if-no-files-found: warn
